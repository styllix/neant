      - name: Compiler le plugin
        run: |
          cd work/Neant-Plugin-Paper-1.21.1-V3/Neant
          gradle clean build --no-daemon
          ls build/libs

      - name: Publier jar et packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work/Neant-Plugin-Paper-1.21.1-V3
          SHA=$(sha1sum Packs/Neant-ResourcePack-Java-1.21.1.zip | cut -d' ' -f1)
          echo "SHA1 du pack Java : $SHA" > notes.txt
          gh release create "neant-build-${{ github.run_number }}" \
            Neant/build/libs/Neant-2.1.0.jar \
            Packs/Neant-ResourcePack-Java-1.21.1.zip \
            Packs/Neant-ResourcePack-Bedrock-1.21.1.mcpack \
            Geyser/neant_items.json \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Neant build ${{ github.run_number }}" --notes-file notes.txt
