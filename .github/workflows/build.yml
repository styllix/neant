      - name: Compiler le plugin
        run: |
          cd work/Neant-Plugin-Paper-1.21.1-V3/Neant
          gradle clean build --no-daemon
          ls build/libs

      - name: Publier jar et packs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd work/Neant-Plugin-Paper-1.21.1-V3
          SHA=$(sha1sum Packs/Neant-ResourcePack-Java-1.21.1.zip | cut -d' ' -f1)
          TAG="neant-2-3-2-build-${{ github.run_number }}"
          echo "SHA1 du pack Java : $SHA" > notes.txt
          echo "Lien du pack : https://github.com/${{ github.repository }}/releases/download/$TAG/Neant-ResourcePack-Java-1.21.1.zip" >> notes.txt
          gh release create "$TAG" \
            Neant/build/libs/Neant-2.3.2.jar \
            Packs/Neant-ResourcePack-Java-1.21.1.zip \
            Packs/Neant-ResourcePack-Bedrock-1.21.1.mcpack \
            Geyser/neant_items.json \
            Datapack/neant-sans-structures.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Neant 2.3.2 build ${{ github.run_number }}" --notes-file notes.txt
