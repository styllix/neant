name: Build Le Neant

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Trouve automatiquement le dossier qui contient build.gradle.kts
      # (fonctionne que le dépôt contienne "Neant/" ou directement le projet à la racine).
      - name: Locate project
        id: locate
        run: |
          FILE=$(find . -name build.gradle.kts -not -path '*/build/*' | head -n 1)
          if [ -z "$FILE" ]; then echo "build.gradle.kts introuvable"; exit 1; fi
          DIR=$(dirname "$FILE")
          echo "Projet trouvé dans : $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Compile
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle clean build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Neant-plugin
          path: ${{ steps.locate.outputs.dir }}/build/libs/*.jar
          if-no-files-found: error
